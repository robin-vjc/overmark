name: Release

# Push a tag like `v1.2.3` to build installers for every platform. They're attached to a draft
# release, which is published automatically once every platform has built successfully.
# If any build fails, the release stays a draft so a broken release never goes public.
#
# Files get the same name in every release (no version number), so the README can link to
# `releases/latest/download/<file>` and those links never need updating.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        run: |
          tag="$GITHUB_REF_NAME"
          if is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" = "true" ]; then
              # A draft from an earlier run of this tag: start again so no stale files remain.
              gh release delete "$tag" --yes
            else
              echo "Release $tag is already published; its files will be replaced."
              exit 0
            fi
          fi
          gh release create "$tag" --draft --verify-tag --title "Overmark $tag" \
            --notes "Download Overmark for your platform below. See the [README](https://github.com/$GH_REPO#install) for which file to pick."

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build ${{ matrix.args }}
      - name: Upload to the release
        shell: bash
        run: |
          mkdir out
          bundle=src-tauri/target/release/bundle
          case "$RUNNER_OS" in
            Windows)
              cp "$bundle"/nsis/*-setup.exe out/Overmark_windows_x64-setup.exe
              cp "$bundle"/msi/*.msi out/Overmark_windows_x64.msi
              # The frontend is embedded in the binary, so the plain .exe runs without installing.
              cp src-tauri/target/release/overmark.exe out/Overmark_windows_x64-portable.exe
              ;;
            macOS)
              cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/Overmark_macos_universal.dmg
              ;;
            Linux)
              cp "$bundle"/appimage/*.AppImage out/Overmark_linux_x86_64.AppImage
              cp "$bundle"/deb/*.deb out/Overmark_linux_amd64.deb
              cp "$bundle"/rpm/*.rpm out/Overmark_linux_x86_64.rpm
              ;;
          esac
          gh release upload "$GITHUB_REF_NAME" out/* --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
